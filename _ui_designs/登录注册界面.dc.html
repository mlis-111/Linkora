<helmet>

<div style="min-width:100%; min-height:100vh; width:max-content; box-sizing:border-box; padding:48px; background:#e7e5df; font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;">
