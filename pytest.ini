[pytest]
# 测试文件路径
testpaths = test

# 测试文件匹配模式
python_files = test_*.py

# 测试类匹配模式
python_classes = Test*

# 测试函数匹配模式
python_functions = test_*

# 自定义标记
markers =
    slow: 标记为慢速测试，可以用 -m "not slow" 排除
    edge_case: 标记为边界情况测试
    integration: 标记为集成测试
    unit: 标记为单元测试

# 添加项目根目录到Python路径
pythonpath = .

# 控制台输出选项
console_output_style = progress

# 最小Python版本
minversion = 6.0

# 添加额外的命令行选项
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
